name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Build
        run: swift build
      - name: Engine tests
        run: swift test
      - name: Capture buffer tests
        run: scripts/ci/capture-ring.sh
      - name: MIDI parser tests
        run: scripts/ci/midi-parser.sh
      - name: Duplex device validation
        run: scripts/ci/duplex-probe.sh
      - name: Recording process-kill recovery
        run: scripts/ci/record-crash.sh
      - name: Release build
        run: swift build -c release
      # No audio device or GUI session on CI: live smoke test and app self-test run locally (scripts/check.sh).

  sanitizers:
    # Memory and threading errors can pass silently in normal runs (one did: a test-only
    # use-after-free that segfaulted only on CI). ASan + TSan make them deterministic failures.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Engine tests (AddressSanitizer)
        run: swift test --sanitize=address
      - name: Engine tests (ThreadSanitizer)
        run: swift test --sanitize=thread

      - name: Capture buffer (ThreadSanitizer)
        run: DALNOK_CAPTURE_TSAN=1 scripts/ci/capture-ring.sh

      - name: MIDI parser (ThreadSanitizer)
        run: DALNOK_MIDI_TSAN=1 scripts/ci/midi-parser.sh

  rt-effects:
    # Xcode's clang on hosted runners may predate [[clang::nonblocking]]; use Homebrew LLVM.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM
        run: brew install llvm
      - name: Real-time effect analysis
        run: scripts/ci/rt-effects.sh
