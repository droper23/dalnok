name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version && xcodebuild -version
      - name: Generated model views are current (engine/api/views.def)
        run: python3 scripts/gen-api.py --check
      - name: Build
        run: swift build
      - name: Engine tests
        run: swift test
      - name: Tempo map conversion tests
        run: scripts/ci/tempo-map.sh
      - name: Capture buffer tests
        run: scripts/ci/capture-ring.sh
      - name: MIDI parser tests
        run: scripts/ci/midi-parser.sh
      - name: Duplex device validation
        run: scripts/ci/duplex-probe.sh
      - name: Recording process-kill recovery
        run: scripts/ci/record-crash.sh
      - name: Plugin scan containment (fake crashing and hanging plugins)
        run: scripts/ci/plugin-scan.sh
      - name: Plugin hosting (test VST3)
        run: scripts/ci/plugin-host.sh
      # No audio device or GUI session on CI: live smoke test and app self-test run locally (scripts/check.sh).

  # Jobs run in parallel, so CI takes as long as the longest one. Each build is cold (checkout resets file times,
  # so a restored .build would rebuild anyway); splitting the release build and the two sanitizers into their
  # own jobs took the wall time from about 9 minutes (ASan then TSan in one job) to about the longest single one (A-19).
  release-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Release build
        run: swift build -c release

  sanitizers:
    # Memory and threading errors can pass silently in normal runs (one did: a test-only
    # use-after-free that segfaulted only on CI). ASan + TSan make them deterministic failures.
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [address, thread]
    name: sanitizers (${{ matrix.sanitizer }})
    steps:
      - uses: actions/checkout@v4
      - name: Engine tests (${{ matrix.sanitizer }} sanitizer)
        run: swift test --sanitize=${{ matrix.sanitizer }}
      - name: Capture buffer (ThreadSanitizer)
        if: matrix.sanitizer == 'thread'
        run: DALNOK_CAPTURE_TSAN=1 scripts/ci/capture-ring.sh
      - name: MIDI parser (ThreadSanitizer)
        if: matrix.sanitizer == 'thread'
        run: DALNOK_MIDI_TSAN=1 scripts/ci/midi-parser.sh

  rt-effects:
    # Xcode's clang on hosted runners may predate [[clang::nonblocking]]; use Homebrew LLVM.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install LLVM
        run: brew install llvm
      - name: Real-time effect analysis
        run: scripts/ci/rt-effects.sh
