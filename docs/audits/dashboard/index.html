<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dalnok — Engineering Audit 2026-11</title>
<style>
:root{
  --bg:#0c1014; --panel:#141a21; --panel2:#1a222b; --text:#e8eef6; --muted:#94a3b3;
  --line:#25313c; --accent:#4fd1c5; --accent2:#8ab4f8; --p0:#ff6b6b; --p1:#ffa94d; --p2:#4dabf7; --p3:#9aa7b4;
  --good:#51cf66; --warn:#ffd43b; --shadow:0 10px 30px rgba(0,0,0,.35);
}
[data-theme="light"]{
  --bg:#f3f6f9; --panel:#ffffff; --panel2:#eef3f8; --text:#101820; --muted:#56626e;
  --line:#d7e0e8; --accent:#0f8f84; --accent2:#2258a8; --p0:#c92a2a; --p1:#b35c00; --p2:#1668b3; --p3:#5c6773;
  --good:#2b8a3e; --warn:#9c6f00; --shadow:0 8px 22px rgba(20,40,60,.10);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif}
a{color:var(--accent2)}
.skip{position:absolute;left:-9999px;top:0;background:var(--accent);color:#04110f;padding:8px 12px;z-index:99}
.skip:focus{left:8px;top:8px}
.topbar{position:sticky;top:0;z-index:30;display:flex;flex-wrap:wrap;gap:12px;align-items:center;
  padding:12px clamp(14px,3vw,32px);background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.brand{font-weight:700;letter-spacing:.2px;font-size:16px}
.brand span{color:var(--accent)}
.rev{font:12px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--muted)}
.spacer{flex:1}
.search{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;min-width:min(320px,60vw)}
.search input{background:none;border:0;color:var(--text);outline:none;width:100%;font:inherit;font-size:14px}
.btn{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:8px;
  padding:7px 11px;font:inherit;font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible, .tab:focus-visible, .chip:focus-visible, .card:focus-visible, tr[tabindex]:focus-visible,
  circle.matrix-dot:focus-visible, .road-item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:4px;overflow-x:auto;padding:10px clamp(14px,3vw,32px) 0;border-bottom:1px solid var(--line)}
.tab{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);padding:9px 12px;
  font:inherit;font-size:14px;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--text);border-bottom-color:var(--accent)}
main{max-width:1280px;margin:0 auto;padding:24px clamp(14px,3vw,32px) 80px}
.panel[hidden]{display:none}
h1{font-size:clamp(22px,2.6vw,30px);margin:4px 0 6px}
h2{font-size:20px;margin:30px 0 12px}
h3{font-size:15px;margin:0 0 8px;letter-spacing:.2px;text-transform:uppercase;color:var(--muted)}
p{margin:0 0 12px}
.lead{color:var(--muted);max-width:80ch}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow)}
.card.click{cursor:pointer}
.card.click:hover{border-color:var(--accent)}
.kpi{font:600 clamp(22px,2.4vw,30px)/1.1 ui-monospace,SFMono-Regular,Menlo,monospace}
.kpi.small{font-size:18px}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;letter-spacing:.3px}
.pill.P0{background:color-mix(in srgb,var(--p0) 18%,transparent);color:var(--p0);border:1px solid color-mix(in srgb,var(--p0) 45%,transparent)}
.pill.P1{background:color-mix(in srgb,var(--p1) 18%,transparent);color:var(--p1);border:1px solid color-mix(in srgb,var(--p1) 45%,transparent)}
.pill.P2{background:color-mix(in srgb,var(--p2) 18%,transparent);color:var(--p2);border:1px solid color-mix(in srgb,var(--p2) 45%,transparent)}
.pill.P3{background:color-mix(in srgb,var(--p3) 18%,transparent);color:var(--p3);border:1px solid color-mix(in srgb,var(--p3) 45%,transparent)}
.pill.effort{background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.tag{display:inline-block;padding:2px 7px;border-radius:6px;background:var(--panel2);border:1px solid var(--line);
  font-size:11.5px;color:var(--muted);margin:2px 4px 2px 0}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel)}
tbody tr:hover{background:var(--panel2)}
tr[data-id]{cursor:pointer}
.num{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font:inherit;
  font-size:12.5px;color:var(--muted);cursor:pointer}
.chip[aria-pressed="true"]{color:var(--text);border-color:var(--accent);background:color-mix(in srgb,var(--accent) 14%,transparent)}
select{background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;font-size:13px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:12px 0}
label.f{display:flex;flex-direction:column;gap:5px;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.count{color:var(--muted);font-size:13px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);
  padding:0;max-width:820px;width:calc(100vw - 32px);max-height:88vh;box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.55)}
.dlg-head{display:flex;gap:12px;align-items:flex-start;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.dlg-body{padding:18px 20px 24px;overflow:auto;max-height:calc(88vh - 74px)}
.dlg-title{margin:0;font-size:18px}
.close{margin-left:auto;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;
  width:32px;height:32px;font-size:16px;cursor:pointer}
.section{margin-top:18px}
.section h4{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
ul{margin:0 0 10px;padding-left:20px}
li{margin:3px 0}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12.5px;background:var(--panel2);padding:1px 5px;border-radius:4px}
pre{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:10px;overflow:auto;font-size:12px}
.bar{height:6px;border-radius:3px;background:var(--panel2);overflow:hidden;margin-top:4px}
.bar>span{display:block;height:100%;background:var(--accent)}
.chart{width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 4;opacity:.6}
.chart .b1{fill:var(--accent)}
.chart .b2{fill:color-mix(in srgb,var(--accent) 34%,transparent)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:6px}
.sw{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:middle}
.diagram{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;overflow:auto}
.node{fill:var(--panel2);stroke:var(--line);stroke-width:1.2}
.node.ok{stroke:var(--good)}
.node.warn{stroke:var(--warn)}
.edge{stroke:var(--muted);stroke-width:1.2;fill:none;marker-end:url(#arrow)}
.edge-label{fill:var(--muted);font-size:10.5px}
.arch{display:grid;gap:14px;grid-template-columns:1fr 1fr}
.arch-col h3{display:flex;gap:8px;align-items:center;text-transform:none;font-size:14px;color:var(--text)}
.arch-item{border:1px solid var(--line);border-radius:9px;padding:9px 11px;margin:7px 0;background:var(--panel2);font-size:13px}
.arch-item b{display:block;font-size:13.5px}
.arch-item.keep{border-left:4px solid var(--good)}
.arch-item.move{border-left:4px solid var(--warn)}
.arch-item.new{border-left:4px solid var(--accent2)}
.road{display:grid;gap:16px}
.phase{border:1px solid var(--line);border-radius:12px;background:var(--panel);padding:14px 16px}
.phase h3{text-transform:none;color:var(--text);font-size:15px;margin-bottom:2px}
.road-item{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.road-item:first-of-type{border-top:0}
.road-item .title{font-size:14px}
.road-item.done .title{text-decoration:line-through;color:var(--muted)}
.blocked{color:var(--warn);font-size:11.5px}
.area-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.area{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--panel2);cursor:pointer;text-align:left;color:var(--text);font:inherit}
.area[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.health{font-size:11px;text-transform:uppercase;letter-spacing:.5px}
.health.good{color:var(--good)} .health.fair{color:var(--warn)} .health.strained{color:var(--p0)}
.matrix-wrap{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px}
.matrix-dot{cursor:pointer}
.note{border-left:3px solid var(--warn);background:color-mix(in srgb,var(--warn) 8%,transparent);padding:10px 12px;border-radius:6px;font-size:13.5px}
.kv{display:grid;grid-template-columns:180px 1fr;gap:6px 14px;font-size:13.5px}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.tooltip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:6px 9px;font-size:12px;box-shadow:var(--shadow);opacity:0;transition:opacity .12s;z-index:50}
.tooltip.on{opacity:1}
@media (max-width: 980px){
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:1fr}
  .arch{grid-template-columns:1fr}
}
@media (max-width: 620px){
  .g2,.g4{grid-template-columns:1fr}
  .kv{grid-template-columns:1fr}
  main{padding-bottom:60px}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>

string.", "evidence": ["engine/src/engine.cpp:282 - `Model before = model_;` runs for every edit, structural or not.", "Parameter edits use the same path: setGainDb, setPan, setMute, setMasterGainDb all call edit(name, false, ...).", "Model contains std::vector<ClipState> with std::string names and std::vector<PluginSlot>, and PluginSlot::state is the base64 plug-in chunk (engine.hpp).", "ADR-0005 acknowledges 'Undo memory is O(model x steps)'.", "Measured (audit-bench, release): 200 undoable gain edits cost 0.075 ms each at 4,096 clips; undo of one edit costs 0.745 ms; RSS grows with each retained copy."], "files": ["engine/src/engine.cpp", "engine/src/engine.hpp"], "recommendation": "Split the edit path: (a) continuous parameters write the runtime atomic and record a coalesced undo entry (one per drag, using the existing begin/end group), without copying the model; (b) structural edits keep snapshot undo but store the model in an immutable, structurally shared form (shared_ptr clip vectors, shared_ptr for plug-in state) so a copy is O(tracks), not O(clips x strings). Keep the transactional guarantee.", "alternatives": ["Inverse-operation undo for a hand-picked set of commands (less memory, more bug surface).", "Cap undo by bytes rather than by step count (a good complementary safeguard)."], "effort": "L", "confidence": "high", "risk": "Structural sharing changes ownership assumptions in compile() and syncRuntimes(); the model copy is also the rollback mechanism, so the replacement must preserve failure atomicity.", "dependencies": [], "verification": ["Existing UndoAndEditing, ModelTests and CommandCatalog suites must pass unchanged.", "Measure RSS after 500 edits at 4,096 clips before and after; target at least 5x reduction.", "Property test: a random command sequence followed by full undo must return to the exact serialised model."], "acceptance": "A fader drag produces one undo step and no model copy; undo depth no longer multiplies clip and plug-in-state memory by 500.", "impact": {"performance": 4, "maintenance": 3, "reliability": 2, "value": 4}, "measured": true}, {"id": "A-04", "title": "Structural edits recompile the whole render snapshot with an O(tracks x clips) loop", "priority": "P1", "category": "Performance", "subsystem": "Render state compilation", "status": "fixed", "summary": "compile() iterates the entire model_.clips vector once per track, so snapshot construction is quadratic in project size. Every structural edit rebuilds the complete snapshot, including delay-compensation graph, solo links and click schedule.", "evidence": ["engine/src/engine.cpp:1860 - the per-track loop contains `for (const auto &c : model_.clips)`, filtered by c.track.", "commit() compiles, and edit(..., structural=true) calls commit() on every structural change.", "Measured (audit-scale, release): structural nudge 0.012 ms at 64 clips, 0.098 ms at 1,024, 0.257 ms at 2,048, 0.770 ms at 4,096 - linear in clips x tracks.", "Building a 4,096-clip model one clip at a time took 1,272 ms because each add recompiles (49 ms at 1,024, 230 ms at 2,048)."], "files": ["engine/src/engine.cpp", "engine/src/render.hpp"], "recommendation": "First make compile linear: bucket clips by track once (O(tracks + clips)) and pass each track its own list. Then add incremental compilation: mark the edited track(s) dirty and rebuild only their RenderTrack plus the routing/compensation pass, reusing the rest of the snapshot. Keep the immutable snapshot and atomic slot unchanged.", "alternatives": ["Cache per-track RenderTrack fragments keyed by a track revision (incremental but more bookkeeping).", "Keep full compilation and debounce edits (hides, does not fix, the cost)."], "effort": "M", "confidence": "high", "risk": "Incremental compilation must not miss cross-track dependencies (sends, sidechains, solo links, delay compensation). Start with the linear bucketing win, which is mechanically safe, then add IncrementalCompile behind a test that compares full vs incremental snapshots.", "dependencies": [], "verification": ["Equivalence test: incremental snapshot must equal a full rebuild for a randomised edit sequence.", "Re-run audit-scale at 64, 1,024 and 4,096 clips; target sub-linear growth.", "Live-path null test after structural edits during playback (existing LiveTests plus a new case)."], "acceptance": "Compiling a 4,096-clip project stays under 0.2 ms and is linear in clips; building that project clip-by-clip is no longer quadratic.", "impact": {"performance": 4, "maintenance": 3, "reliability": 2, "value": 4}, "measured": true, "resolution": "compile() buckets clips by track once, so each RenderTrack build is linear in clips instead of scanning every clip per track. Measured on the same generated 4,096-clip model (16 tracks x 256 clips, release, 48 kHz): structural nudge 0.770 ms -> 0.255 ms, undo 0.745 ms -> 0.238 ms, clip-by-clip build 1,272 ms -> 527 ms. All 191 engine tests pass. Incremental per-track compilation (the second half of the recommendation) is still open."}, {"id": "A-05", "title": "The UI rebuilds the entire view model on every revision change, including during drags", "priority": "P1", "category": "Performance", "subsystem": "App / model sync", "status": "open", "summary": "Session.refresh() walks every track, clip, plug-in, send and automation lane through the C API whenever the model revision changes. MainWindow calls it from a 60 Hz tick and after every edit, and modelChanged() then rebuilds the device panel and mixer. A fader drag therefore pays a full O(tracks + clips) C-API pass per mouse event.", "evidence": ["app/macos/Dalnok/Session.swift:95 - refresh() re-queries dalnok_track_count/at/info, dalnok_track_clip_at, dalnok_clip_info, note lists, plug-in slots, sends, automation and hidden flags.", "Every edit helper calls refresh() directly (Session.swift:232 setGain, 311 setPan, 312 setMute, 478 moveClip, ...).", "MainWindow.swift:313 installs a 60 Hz timer whose tick() calls session.refresh() and pollJobs(); modelChanged() rebuilds devicePanel and mixer.", "Measured (audit-scale, release, one refresh pass): 0.006 ms at 64 clips, 0.673 ms at 1,024, 3.386 ms at 2,048, 15.931 ms at 4,096 - about 3.9 us per clip."], "files": ["app/macos/Dalnok/Session.swift", "app/macos/Dalnok/MainWindow.swift", "engine/src/dalnok_api.cpp"], "recommendation": "Introduce model change sets. Either the engine publishes a small, bounded change summary per revision (changed track/clip ids plus a kind), or the UI queries a per-track revision and re-reads only tracks whose revision moved. Coalesce refresh to one per display frame, and let invalidation target the specific views (timeline lanes, headers, mixer strips) rather than rebuilding all of them.", "alternatives": ["Keep full refresh but skip it when only continuous parameters changed (a cheap first step that removes the drag path from the problem).", "Move the snapshot into the engine as a serialised buffer the UI decodes in bulk (fewer ABI calls, still O(model))."], "effort": "L", "confidence": "high", "risk": "Risk of a second source of truth. Keep the engine authoritative and make the change set a hint only; correctness must still fall back to a full refresh when a hint is missing.", "dependencies": [], "verification": ["Instrument refresh duration in the app (signpost or debug counter) on a generated 64-track and 256-track project.", "Self-test and both-theme UI walk must show no stale view after edits from scripts/undo.", "Add a test that mutating an unrelated track does not re-read untouched clips."], "acceptance": "Dragging a fader on a 4,096-clip project keeps per-frame UI work under 4 ms, and an edit to one track re-reads only that track.", "impact": {"performance": 4, "maintenance": 3, "reliability": 3, "value": 4}, "measured": true}, {"id": "A-06", "title": "Engine is a god object: 2,526-line implementation and 117 methods on one class", "priority": "P1", "category": "Architecture", "subsystem": "Engine core", "status": "open", "summary": "A single Engine class owns the device lifecycle, transport, recording, MIDI input, the project model, undo, plug-in instantiation, routing, launcher, stretch cache, offline rendering and statistics. Every new feature widens the same class, its header and its test surface.", "evidence": ["engine/src/engine.cpp is 2,526 lines; engine/src/engine.hpp is 598 lines; the inventory counts 117 Engine:: method definitions.", "engine.hpp's public section covers device, capture, record, MIDI, media pool, model, ~50 edit commands, undo, project save/load/import, transport, offline render and stats.", "Structural coupling is visible in applyProject(): it reaches into the model, the pool, the plug-in map, id counters, cycle transport state and the render cache in one function (project.cpp:815)."], "files": ["engine/src/engine.cpp", "engine/src/engine.hpp"], "recommendation": "Extract cohesive services behind the existing Engine facade, in dependency order and without behaviour change: Transport (playhead, cycle, punch, clicks), RecordingService (spool, journals, take placement), PluginHostService (instances, state, latency), RenderCompiler (compile + delay graph), UndoStack. Engine keeps the model and the C API entry points. Do one extraction per pull request with tests unchanged.", "alternatives": ["Split by file only (engine_model.cpp, engine_render.cpp) - improves navigation, leaves the class coupled.", "Full rewrite of the engine core (rejected: high risk, no user-visible benefit)."], "effort": "L", "confidence": "high", "risk": "Mechanical moves can break invariants held implicitly (e.g. id counters, revision bumps, savedRevision). Add assertions and keep the existing test suite as the referee.", "dependencies": [], "verification": ["All 188 engine tests pass after each extraction with no test edits.", "Real-time analysis (scripts/ci/rt-effects.sh) stays clean.", "Line and method counts for engine.cpp/engine.hpp fall monotonically."], "acceptance": "No single translation unit exceeds ~1,200 lines of engine logic, and a feature such as 'new built-in effect' touches one service, not Engine.", "impact": {"performance": 2, "maintenance": 5, "reliability": 3, "value": 4}, "measured": true}, {"id": "A-07", "title": "Plug-in state strings live inside the undoable model and are copied by every edit", "priority": "P1", "category": "Data model", "subsystem": "Project model / plugin hosting", "status": "fixed", "summary": "PluginSlot::state holds the base64 plug-in chunk in the value model. Because edits copy the model and undo keeps 500 copies, a project with large plug-in states multiplies those chunks by undo depth and copies them on unrelated edits.", "evidence": ["engine/src/engine.hpp - `std::string state; // last known plugin state (used when the plugin is missing, and for saving)` inside PluginSlot, which is inside TrackState inside Model.", "State is written by pluginState/setPluginState and serialised into the project (project.cpp).", "captureLiveState(Model&) refreshes it on the control thread, so it is part of ordinary edits.", "ADR-0009 requires state to be kept for missing plug-ins, so removing it is not an option."], "files": ["engine/src/engine.hpp", "engine/src/engine.cpp", "engine/src/project.cpp"], "recommendation": "Store plug-in state out of line as `std::shared_ptr<const std::string>` (or a pool id referencing an immutable blob), so model copies share one buffer and edits are O(1) per slot. Serialisation walks the blobs; captureLiveState replaces the pointer rather than mutating the string.", "alternatives": ["Keep the string but move it to a side table keyed by slot id (needs careful lifetime and undo rules).", "Compress state before storing (helps disk, not copies)."], "effort": "S", "confidence": "high", "risk": "Undo must still restore the exact state; a shared immutable blob preserves that if replacement is copy-on-write.", "dependencies": ["A-03"], "verification": ["Plugin state round-trip tests and the missing-plug-in test still pass.", "Measure model copy cost with a 5 MB synthetic state before and after."], "acceptance": "Copying a model with plug-ins performs no plug-in-state byte copies; undo memory for plug-in state is bounded by the number of distinct states.", "impact": {"performance": 3, "maintenance": 3, "reliability": 2, "value": 3}, "measured": false, "resolution": "PluginSlot::state is now SharedPluginState, an immutable std::shared_ptr<const std::string> blob; model copies and undo snapshots share it and a new state replaces the pointer. Serialisation and the missing-plug-in path read through str(). All 191 tests pass, including state round-trip and missing-plug-in suites."}, {"id": "A-08", "title": "Plug-in instantiation blocks the AppKit main thread during project apply", "priority": "P1", "category": "Reliability", "subsystem": "App / plugin hosting", "status": "open", "summary": "dalnok_project_apply calls Engine::instantiatePlugins() synchronously on the calling thread, and the app applies projects on the main actor. A plug-in that waits on the main queue during initialisation therefore freezes the whole app; MODO BASS produced a multi-minute stall that was never explained or fixed.", "evidence": ["engine/src/project.cpp:820 - `instantiatePlugins(); // loads plugin code on this (control) thread`.", "app/macos/Dalnok/EngineBridge.swift - loadInBackground/importForeign prepare off-thread, then call dalnok_project_apply on the main actor.", "CURRENT_STATE.md (2026-11-18): MODO BASS stalled the built app for minutes while enumerating pattern folders; the cause is 'not established' and 'not fixed'.", "CURRENT_STATE.md explicitly warns: 'Changing that needs a designed, measured change ... not a quick move.'"], "files": ["engine/src/project.cpp", "engine/src/engine.cpp", "app/macos/Dalnok/EngineBridge.swift"], "recommendation": "Split apply into a cheap model swap and an asynchronous plug-in activation phase: show the project immediately with plug-ins in a 'loading' state kept from their saved state, instantiate on a worker that owns an NSApplication-compatible run loop where required, and surface progress plus a cancel. Until that exists, add a watchdog that reports a plug-in taking longer than N seconds instead of letting the app appear dead.", "alternatives": ["Instantiate plug-ins lazily when their track is first played (faster load, risk of a stall during playback).", "Host plug-ins out of process (A-01) - solves both problems but is the larger change."], "effort": "L", "confidence": "medium", "risk": "Many plug-ins require the main thread for creation and UI; moving them off it can break them. The design must allow a main-thread activation queue with a bounded, visible wait.", "dependencies": ["A-01"], "verification": ["A deliberately slow fixture instrument (sleeps 30 s in initialisation) must leave the app responsive and cancellable.", "MODO BASS project opens with a responsive UI.", "Existing plug-in state restoration tests still pass."], "acceptance": "No project apply blocks the main thread for more than one frame; slow plug-ins show progress and can be cancelled without losing the project.", "impact": {"performance": 3, "maintenance": 3, "reliability": 5, "value": 4}, "measured": false}, {"id": "A-09", "title": "All media is decoded fully into RAM; there is no disk streaming", "priority": "P1", "category": "Performance", "subsystem": "Media", "status": "open", "summary": "Every audio file is decoded to float32 in memory at load, plus a peak pyramid. Long recordings and large sessions scale memory linearly with total audio duration, and project open pays the full decode before the model is applied.", "evidence": ["engine/src/media.hpp: 'Decoded, immutable audio held in memory, plus a min/max peak pyramid.'", "Media owns std::vector<std::vector<float>> channels_ with no paging or backing store.", "CURRENT_STATE.md: 'Media is fully decoded into RAM, about 23 MB per stereo minute at 48 kHz.'", "Measured RSS: 401 MB for a generated 64-track x 30 s project, 568 MB for 256 tracks x 10 s, 469 MB of project audio on disk."], "files": ["engine/src/media.hpp", "engine/src/media.cpp", "engine/src/platform/macos/audio_file_macos.cpp"], "recommendation": "Introduce a MediaSource abstraction: a block cache over a memory-mapped or read-backed file for long media, with an in-memory fast path for short clips and stretched renders. The audio thread reads only from pre-resident blocks (or from a lock-free cache with a guaranteed block per playing clip); peaks stay in memory and can be built incrementally. Bind the policy to a threshold (for example, stream clips longer than 60 s).", "alternatives": ["Memory-map every file (simple, but page faults can occur on the audio thread).", "Keep full decode and cap project length (unacceptable for a DAW)."], "effort": "XL", "confidence": "medium", "risk": "Real-time correctness: a cache miss on the audio thread is a dropout. Needs a prefetch thread and a guaranteed-residency policy per playing clip, plus careful seek and cycle handling.", "dependencies": [], "verification": ["A 2-hour stereo recording plays with RSS independent of file length and zero dropouts.", "Seek, cycle and loop playback across block boundaries stay click-free.", "Offline render output is bit-identical to the in-memory path for the same project."], "acceptance": "Opening and playing a project with hours of audio keeps resident memory bounded (for example under 200 MB of audio), and no audio thread path performs file I/O or allocation.", "impact": {"performance": 4, "maintenance": 4, "reliability": 3, "value": 4}, "measured": true}, {"id": "A-10", "title": "No fuzzing or property tests for project parsing and importers; sanitizers are CI-only", "priority": "P1", "category": "Reliability", "subsystem": "Persistence / import", "status": "partial", "summary": "The project reader and four foreign importers parse untrusted, complex files with hand-written logic. Tests cover known fixtures and a few corrupt cases, but there is no fuzzing or property-based round-trip testing, and the local check script runs sanitizers only when asked.", "evidence": ["tests/engine has 31 files and 188 tests, including targeted corrupt-MIDI and truncation cases, but no fuzz target or corpus.", "scripts/check.sh runs ASan/TSan only under DALNOK_SANITIZE=1; CI runs them in a separate job.", "project.cpp and import/*.cpp use manual index and offset arithmetic over JSON, plists and XML; pugixml and a hand-written JSON reader are in the parse path."], "files": ["engine/src/project.cpp", "engine/src/json.cpp", "engine/src/import/"], "recommendation": "Add a small libFuzzer target for dalnok_project_prepare and dalnok_project_import_report, seeded with the generated fixtures and the existing corrupt cases, run nightly. Add property tests: save -> load -> save must be byte-stable for a random model; import must never crash and must return a report. Promote one sanitizer run into the default local check.", "alternatives": ["Corpus-only regression tests (cheap, catches repeats only).", "External grammar-based fuzzing of the JSON reader (useful subset)."], "effort": "M", "confidence": "high", "risk": "Fuzzing finds crashes that must be triaged; budget for the fixes.", "dependencies": [], "verification": ["Fuzz target runs for 10 minutes with no crash on the seed corpus.", "Property test over 1,000 random models passes.", "ASan/TSan clean on the new targets."], "acceptance": "Parsing any mutated project or import file either fails with an error or succeeds; it never crashes, reads out of bounds or leaks.", "impact": {"performance": 1, "maintenance": 3, "reliability": 5, "value": 4}, "measured": false, "resolution": "Added save -> load -> save property tests over randomised models (JSON-compared so key order is irrelevant) and a 120-case mutated/truncated project corpus that must fail without crashing or over-reading. libFuzzer targets, a nightly seed corpus, and a default local sanitizer run are still open."}, {"id": "A-11", "title": "The audio callback visits every track in every block, even silent ones", "priority": "P2", "category": "Performance", "subsystem": "Real-time render", "status": "open", "summary": "renderBlock iterates all RenderTracks per block, performing solo checks, automation evaluation, sidechain wiring and delivery for tracks with no clip in the block. Cost is linear in track count regardless of audible content.", "evidence": ["engine/src/render.cpp - `for (const RenderTrack &t : state.tracks)` runs unconditionally for every block.", "Measured live path (release, 512-frame blocks): 31 us at 8 tracks, 142 us at 64, 561 us at 256, 1,114 us at 512 (10.4% of the 10.67 ms budget). Per-track cost is about 2.2 us per block.", "The existing 512-track result is still well inside budget, so this is headroom work, not a current failure."], "files": ["engine/src/render.cpp", "engine/src/render.hpp"], "recommendation": "Precompute, per snapshot, a per-track clip interval index and skip tracks with no clips, notes, active slot, inserts with tails, automation or delay lines in the current block. Keep the skip test branch-free and conservative: any plug-in on the track disables skipping. Measure before and after at 256 and 512 tracks.", "alternatives": ["Process only tracks whose output is audible after solo/mute (subset of the same idea).", "SIMD the per-track inner loops first (see A-13) - different axis, can combine."], "effort": "M", "confidence": "high", "risk": "Incorrect skipping silences a track or kills a reverb tail; the conservative rule (never skip a track with plug-ins or delay compensation) bounds the risk.", "dependencies": ["A-04"], "verification": ["Offline-render null test: output must be sample-identical with and without skipping on a randomised project.", "Re-run bench at 8/64/256/512 tracks; report actual delta, not an estimate."], "acceptance": "A 256-track project with 8 audible tracks costs close to an 8-track project, with bit-identical output.", "impact": {"performance": 3, "maintenance": 2, "reliability": 2, "value": 3}, "measured": true}, {"id": "A-12", "title": "No denormal or floating-point environment guard in the DSP path", "priority": "P2", "category": "Performance", "subsystem": "DSP / real-time", "status": "fixed", "summary": "Filters, reverbs and plug-ins can decay into denormal floats, which are dramatically slower on some CPUs. Dalnok neither sets flush-to-zero/denormals-are-zero for the audio thread nor flushes denormals in its own feedback paths.", "evidence": ["No match for denormal, FTZ, DAZ or fesetround in engine/src or engine/include.", "Built-in Channel EQ and hosted plug-ins run feedback filter structures (engine/src/fx/channel_eq.cpp, hosted adapters).", "The real-time analysis checks blocking behaviour, not floating-point state."], "files": ["engine/src/fx/channel_eq.cpp", "engine/src/render.cpp", "engine/src/platform/macos/coreaudio_device.cpp"], "recommendation": "Set the audio thread's FP environment once at callback entry (or at device start) to flush denormals, saving and restoring CR on x86 and using the ARM FPCR FZ bit on Apple Silicon, and add a small flush in Dalnok's own one-pole and biquad states. Measure tail CPU on a reverb/eq tail benchmark with a -60 dB input.", "alternatives": ["Add a tiny DC/denormal offset in feedback paths only (less invasive, less complete).", "Rely on plug-ins to handle it (they often do not)."], "effort": "S", "confidence": "medium", "risk": "Changing FP state affects all plug-ins on the thread; a plug-in may rely on gradual underflow for extreme dynamics. Restore state on exit.", "dependencies": [], "verification": ["Benchmark: 30 s of decaying noise through Channel EQ and a reverb, measure CPU before and after.", "Numerical test: output differs only below -140 dBFS."], "acceptance": "No measurable denormal penalty in a decay-tail benchmark; audio output unchanged above -140 dBFS.", "impact": {"performance": 2, "maintenance": 2, "reliability": 2, "value": 2}, "measured": false, "resolution": "The live callback and both offline render paths set flush-to-zero (FPCR.FZ on arm64, MXCSR FTZ|DAZ on x86) and restore the caller's mode on exit. New test subnormalSamplesFlushToZeroOnLiveAndOfflinePaths feeds 1e-40 samples and requires exact silence on both paths; all 191 tests pass."}, {"id": "A-13", "title": "Mixing and gain/pan are scalar; no SIMD despite an Accelerate dependency", "priority": "P2", "category": "Performance", "subsystem": "Real-time render", "status": "open", "summary": "The per-sample mix, fader ramp, meter and clip copy loops are scalar C++ with per-sample branches. The project already links Accelerate for the stretch library, so vectorisation has no new dependency cost.", "evidence": ["engine/src/render.cpp - mixClip, the fader ramp, meterLevel and deliver() are scalar loops; the packed-mono path uses a per-sample constant-power approximation.", "Offline throughput measured at 642x realtime for 8 tracks but 20x at 256 and 10x at 512, i.e. cost is dominated by per-track scalar work.", "Package.swift links Accelerate for DalnokDSP only; the engine target could use it too."], "files": ["engine/src/render.cpp", "engine/src/render.hpp", "Package.swift"], "recommendation": "Vectorise four hot loops with vDSP or portable NEON intrinsics: clip copy with gain, fade envelope, fader/pan ramp and peak metering. Keep a scalar fallback for other platforms and for the offline path's determinism tests, and require bit-identical (or documented 1e-6) results.", "alternatives": ["Enable compiler auto-vectorisation with restrict/no-alias hints (cheaper, less predictable).", "SIMD only for meters and clip copy (highest value per line)."], "effort": "M", "confidence": "medium", "risk": "Changed rounding can break bit-exact null tests; gate with tolerance-based tests and keep the scalar path selectable.", "dependencies": [], "verification": ["Offline null test within 1e-6 against the scalar path.", "Re-run bench; report the measured delta."], "acceptance": "Measured improvement of at least 25% in live-path cost at 64 and 256 tracks, with output within tolerance.", "impact": {"performance": 3, "maintenance": 3, "reliability": 1, "value": 2}, "measured": false}, {"id": "A-14", "title": "Render-snapshot handoff degrades silently when the retire queue fills", "priority": "P2", "category": "Reliability", "subsystem": "Real-time handoff", "status": "open", "summary": "The audio thread adopts a new snapshot only when the 64-entry retire queue has space. If the control thread stops collecting, edits quietly stop taking effect (playback continues with stale state) and nothing surfaces it.", "evidence": ["engine/src/engine.cpp:2266 - `if (!retired_.full()) { ... adopted ... }`.", "SpscQueue<RenderState*, 64> retired_ in engine.hpp; collectGarbage() is called from the UI tick, CLI loops and some engine entry points.", "swaps_ is counted, but the UI does not display it and no test asserts that a pending snapshot is adopted within N callbacks."], "files": ["engine/src/engine.cpp", "engine/src/engine.hpp"], "recommendation": "Expose handoff health (pending age in callbacks, retired depth high-water mark) in DalnokStats, add a self-test assertion that an edit becomes audible within a few callbacks, and make collectGarbage cheap enough to call unconditionally each callback path already does. If backlog is a real risk, add a lock-free free-list so retirement cannot block adoption.", "alternatives": ["Larger queue (defers the problem).", "Let the audio thread free snapshots (forbidden by the real-time rules)."], "effort": "S", "confidence": "high", "risk": "Low; instrumentation only, unless the free-list is added.", "dependencies": [], "verification": ["Test: stop calling collectGarbage for 100 callbacks, then verify a metric reports the backlog.", "Test: an edit during playback is audible within N callbacks."], "acceptance": "Handoff backlog is observable in stats and covered by a test; no silent stale-state window longer than the documented bound.", "impact": {"performance": 1, "maintenance": 2, "reliability": 4, "value": 3}, "measured": false}, {"id": "A-15", "title": "Hand-written C API facade and duplicated view construction", "priority": "P2", "category": "Architecture", "subsystem": "C API / front end", "status": "open", "summary": "dalnok_api.cpp is 1,285 lines of repetitive argument marshalling against a 761-line header with 211 functions and a manually maintained DALNOK_API_VERSION. The Swift side then rebuilds view structs field by field, so every model field crosses three hand-edited copies.", "evidence": ["Inventory: 211 C API functions declared in engine/include/dalnok/dalnok.h; DALNOK_API_VERSION is a hand-edited constant.", "dalnok_api.cpp repeats the same copyOut/statusFor pattern per entry point.", "Session.swift manually maps DalnokTrackInfo/DalnokClipInfo into TrackView/ClipView, including a second dalnok_track_info call per track for height."], "files": ["engine/src/dalnok_api.cpp", "engine/include/dalnok/dalnok.h", "app/macos/Dalnok/Session.swift"], "recommendation": "Describe the model DTOs once (a small IDL or a single header of plain structs) and generate the C facade plus the Swift decode helpers. Keep the C ABI and the version constant, generated from the same source. In the short term, remove the duplicate dalnok_track_info call and return height in the first query.", "alternatives": ["Bulk model query (one call returning a packed buffer) instead of generating bindings - smaller change, also removes per-field ABI overhead.", "Leave as is and rely on tests (works today, cost grows with each field)."], "effort": "L", "confidence": "medium", "risk": "Generated code must stay debuggable and the ABI stable; a bulk query changes the C surface and needs a version bump.", "dependencies": ["A-05"], "verification": ["Generated output compiles with the existing tests unchanged.", "API version bump documented; old headers still load old projects."], "acceptance": "Adding a model field requires editing one definition, not three; per-clip read cost drops measurably.", "impact": {"performance": 3, "maintenance": 4, "reliability": 3, "value": 3}, "measured": false}, {"id": "A-16", "title": "Project format is a single hand-written reader/writer with no schema or migration table", "priority": "P2", "category": "Maintainability", "subsystem": "Persistence", "status": "open", "summary": "project.cpp (851 lines) writes and reads one JSON document with a version integer and ad-hoc per-field defaults. Backward compatibility depends on remembering every old key; there is no schema, no explicit migration list, and no round-trip property test.", "evidence": ["project.cpp: kFormatVersion = 13 with a comment listing versions 3-13 and their meanings.", "describe()/prepareDocument() are separate hand-written halves with per-field optional handling.", "Existing tests cover representative documents and rejection of bad files, but not arbitrary round-trips."], "files": ["engine/src/project.cpp", "tests/engine/ModelTests.swift", "tests/engine/EngineTests.swift"], "recommendation": "Add a machine-readable schema and a versioned migration function chain (v3 -> v4 -> ...), then a property test that saves and reloads random models at each supported version. Keep JSON for readability; no need to change serialisation technology.", "alternatives": ["Switch to a binary format (faster, but loses the debuggability that has been valuable for support).", "Keep as is with more fixtures (does not scale with model growth)."], "effort": "M", "confidence": "high", "risk": "Low; migrations must be tested against real old documents. Never publish user projects.", "dependencies": ["A-10"], "verification": ["Round-trip property test over generated models.", "Fixtures for every format version 1-13 load unchanged."], "acceptance": "Every historical format version loads, and save/load is stable under random models.", "impact": {"performance": 1, "maintenance": 4, "reliability": 4, "value": 3}, "measured": false}, {"id": "A-17", "title": "Theme state is global and views branch on Graphite vs Warm Analog", "priority": "P2", "category": "Architecture", "subsystem": "UI / theming", "status": "open", "summary": "Theme tokens are static globals (Theme, Analog.on) and many views branch on the active theme. Switching appearance requires tearing down and relaunching the window, and a third theme would touch many view files.", "evidence": ["app/macos/Dalnok/MainWindow.swift:320 tearDown(keeping:) exists specifically 'before a live theme switch' and closes windows.", "CURRENT_STATE.md: 'Live theme switching (Relaunch Now is the stopgap)'.", "Analog.swift, Pedals.swift, Faceplate.swift and Panels.swift each read theme globals and switch drawing paths."], "files": ["app/macos/Dalnok/Theme.swift", "app/macos/Dalnok/Analog.swift", "app/macos/Dalnok/MainWindow.swift"], "recommendation": "Turn the theme into an injected value type (a struct of tokens plus a small set of drawing strategies passed to views on creation), and make theme changes rebuild the view tree in place. Do not build a general skinning engine; just remove the global so a third theme is additive.", "alternatives": ["Keep globals and relaunch (status quo; inexpensive, blocks live switching and multiple windows per theme).", "Full design-system rewrite (rejected: no user-visible benefit)."], "effort": "M", "confidence": "medium", "risk": "Broad but mechanical; screenshot regression is the main risk, and both-theme snapshots already exist.", "dependencies": [], "verification": ["Both themes render identically in before/after snapshots (pixel diff or reviewed pairs).", "Switching theme with a project open keeps playback, selection and undo intact."], "acceptance": "Theme can be switched without relaunch, and adding a third theme requires no edits to existing views.", "impact": {"performance": 1, "maintenance": 4, "reliability": 2, "value": 2}, "measured": false}, {"id": "A-18", "title": "The UI self-test is a 2,323-line monolith and is timing/focus sensitive", "priority": "P2", "category": "Maintainability", "subsystem": "Testing", "status": "open", "summary": "SelfTest.swift drives menus, clicks, drags and both themes in one file, with real timers and window focus. Failures caused by the machine (locked screen, another app in front, 44.1 kHz output) are documented in CURRENT_STATE, which makes the suite hard to trust as a gate.", "evidence": ["SelfTest.swift is 2,323 lines, the second-largest file in the repository, and contains both harness and fixtures.", "CURRENT_STATE.md: 'when the owner uses the Mac during a run, focus- and timing-sensitive checks can fail'; six checks fail at 44.1 kHz and pass at 48 kHz.", "scripts/check.sh runs the self-test only when a GUI session exists, so CI never runs it."], "files": ["app/macos/Dalnok/SelfTest.swift", "app/macos/Dalnok/UIWalk.swift", "scripts/check.sh"], "recommendation": "Split fixtures, the driver (menus/events) and the assertions into separate files; inject a clock and a simulated output sample rate; mark environment-dependent checks explicitly and report them separately from failures. Add a headless subset (model plus view snapshots) that CI can run.", "alternatives": ["Move all UI testing to XCTest/XCUITest (heavier, slower, but standard).", "Keep one file and add retries (hides flakiness)."], "effort": "M", "confidence": "high", "risk": "Refactoring the harness can lose coverage silently; migrate section by section with check counts asserted.", "dependencies": [], "verification": ["Check count before and after must match exactly.", "A run with a simulated 44.1 kHz device and no screen focus must pass or report environment-skipped checks."], "acceptance": "Self-test outcomes are deterministic at 44.1 and 48 kHz without a focused screen, and failures are attributable to the product.", "impact": {"performance": 1, "maintenance": 4, "reliability": 3, "value": 3}, "measured": false}, {"id": "A-19", "title": "Build is a single package with one monolithic C++ target and no compile cache", "priority": "P2", "category": "Developer productivity", "subsystem": "Build", "status": "open", "summary": "A clean debug build takes 21 s and a clean release build 69 s on an M3 Max; engine sources are one SwiftPM C++ target, so any engine header change rebuilds the whole engine. There is no ccache/sccache and no compile_commands.json for tooling.", "evidence": ["Measured on this machine: clean debug 21 s, clean release 69 s, incremental CLI-only rebuild 6.9 s, no-op 0.4 s.", "Package.swift declares one DalnokEngine target over all of engine/src plus pugixml.", "No cache configuration in scripts or CI; the CI workflow builds cold on every run."], "files": ["Package.swift", ".github/workflows/ci.yml", "scripts/check.sh"], "recommendation": "Split the engine target along stable seams (core model/render, hosting adapters, import, built-in fx) so a change rebuilds one module, and add sccache or a CMake+ninja preset for the engine with compile_commands.json. Measure clean and incremental times before and after; do not change the C API.", "alternatives": ["Keep SwiftPM and rely on a larger CI runner (does not help local iteration).", "Unity builds (faster, worse incremental behaviour)."], "effort": "M", "confidence": "medium", "risk": "Target splits can create duplicate symbols or expose hidden header dependencies; do it after A-06 clarifies module boundaries.", "dependencies": ["A-06"], "verification": ["Clean and incremental timings recorded before and after.", "CI duration compared over five runs."], "acceptance": "A one-line change in a hosting adapter rebuilds in under 10 s and CI wall time drops measurably.", "impact": {"performance": 3, "maintenance": 3, "reliability": 1, "value": 2}, "measured": true}, {"id": "A-20", "title": "Real-time and model constants are scattered magic numbers", "priority": "P3", "category": "Code clarity", "subsystem": "Engine core", "status": "open", "summary": "Important limits and coefficients are literals in place: 512-frame block, 5 ms transport fade, 4 Hz meter DC tracker, 500 undo steps, 64-entry retire queue, 4096-entry MIDI queue, 8192-sample tap, 40-400 pt track height.", "evidence": ["kMaxBlock = 512 in render.hpp; kMaxUndo = 500 in engine.cpp; meterLevel k = 5e-4 in render.hpp; kTransportFadeSeconds and queue sizes in engine.cpp/engine.hpp.", "Track height range in engine.hpp; tap size in plugin_host.hpp; capture block 8192 in engine.hpp."], "files": ["engine/src/render.hpp", "engine/src/engine.cpp", "engine/src/plugin_host.hpp"], "recommendation": "Collect them in one policy header with names and units, and reference it from both engine and tests. This is documentation as much as code: each constant gets a one-line reason.", "alternatives": ["Leave in place and document in the architecture note."], "effort": "S", "confidence": "high", "risk": "None if values are unchanged.", "dependencies": [], "verification": ["Build and full test suite pass with identical values."], "acceptance": "No unexplained numeric literal on the real-time path.", "impact": {"performance": 1, "maintenance": 2, "reliability": 1, "value": 1}, "measured": false}, {"id": "A-21", "title": "Error model collapses distinct failures into two status codes", "priority": "P3", "category": "Maintainability", "subsystem": "C API", "status": "open", "summary": "Almost every failure returns DALNOK_ERR_INVALID_ARG or DALNOK_ERR_NOT_FOUND based on a string prefix, with the detail in a char buffer. The UI cannot distinguish retryable, user error, missing dependency and internal faults.", "evidence": ["engine/src/dalnok_api.cpp: statusFor() maps 'no such' to NOT_FOUND, everything else to INVALID_ARG.", "commands.cpp duplicates the same mapping.", "Swift callers surface the raw string (EngineError(description: cString(err)))."], "files": ["engine/src/dalnok_api.cpp", "engine/src/commands.cpp", "engine/include/dalnok/dalnok.h"], "recommendation": "Add a small enum of error classes (invalid argument, not found, unsupported, device, io, internal) with the existing codes kept as aliases, and return it from the engine rather than deriving from message text.", "alternatives": ["Keep strings and add a code only for new APIs."], "effort": "S", "confidence": "high", "risk": "ABI-compatible enum extension; existing callers keep working.", "dependencies": [], "verification": ["Each error class covered by a test; UI messages unchanged or improved."], "acceptance": "Callers can branch on error class without parsing text.", "impact": {"performance": 1, "maintenance": 2, "reliability": 2, "value": 2}, "measured": false}, {"id": "A-22", "title": "View-only state pollutes the audio/model undo history", "priority": "P3", "category": "UX / model", "subsystem": "Project model", "status": "open", "summary": "Track height and hidden flags are undoable model commands, so a UI layout change sits in the same undo stack as a recording or an edit, and undo after a layout tweak can surprise the user.", "evidence": ["dalnok_track_set_height documented as 'view only ... undoable' in dalnok.h.", "DalnokTrackInfo.height and DalnokTrackState.hidden are part of the saved model.", "Session.setTrackHeight calls dalnok_track_set_height then refresh()."], "files": ["engine/include/dalnok/dalnok.h", "engine/src/engine.cpp", "app/macos/Dalnok/Session.swift"], "recommendation": "Keep view state in the project document but out of the undo stack, or coalesce it into a single 'Layout' step that is only recorded when an actual audio edit follows. Choose one rule and apply it to height, hidden, collapse and zoom.", "alternatives": ["Move view state to a sidecar workspace file (cleanest undo, but project sharing loses layout)."], "effort": "S", "confidence": "high", "risk": "Changes expected undo labels; self-test assertions must be updated deliberately.", "dependencies": [], "verification": ["Undo after a layout change restores the last audio edit, not the layout."], "acceptance": "Audio undo history is not consumed by pure view changes.", "impact": {"performance": 1, "maintenance": 2, "reliability": 2, "value": 2}, "measured": false}, {"id": "A-23", "title": "CURRENT_STATE.md is stale and contradicts the source in several places", "priority": "P2", "category": "Documentation", "subsystem": "Docs", "status": "fixed", "summary": "The project's own status document lists features as 'not yet' or 'known defects' that are implemented and tested, which makes it an unreliable guide for contributors and for AI-assisted work.", "evidence": ["CURRENT_STATE.md 'Not yet / incomplete': 'Plug-in editors, parameters and automation, latency compensation, AU/CLAP hosting' - all four exist (PluginWindow.swift, AutomationTests, DelayCompensationTests, au_host.mm, clap_host.cpp).", "The same list says punch in/out, count-in and multiple armed audio tracks are missing; CURRENT_STATE's own later sessions describe them as implemented, and tests exist (PunchTests, MultiInputTests, CycleTests).", "The 'Architecture (now)' paragraph cites C API v11 while the header is at v29."], "files": ["CURRENT_STATE.md", "CHANGELOG.md", "03 - Architecture/System Overview.md"], "recommendation": "Make the capability matrix generated or test-linked: each row references a test, self-test check or benchmark, and the parity page's verified/implemented vocabulary is reused. Keep the narrative session log, but derive the 'Verified working / Not yet' table from evidence.", "alternatives": ["Manual rewrite now and a rule to update per session (what the repo already asks for, and it drifted)."], "effort": "S", "confidence": "high", "risk": "None; the risk is continuing to trust stale docs.", "dependencies": [], "verification": ["Every matrix row points at a test or benchmark that exists."], "acceptance": "No capability claim without a linked check; C API version references are current.", "impact": {"performance": 1, "maintenance": 4, "reliability": 2, "value": 3}, "measured": false, "resolution": "CURRENT_STATE.md now points at the audit roadmap, lists the real remaining gaps, records the C API at v29, and its Verified working table links the plug-in, automation, compensation, punch/count-in and multi-input suites instead of describing them as missing."}]}</script>

  /* ---------- performance ---------- */
  function barChart(rows, labelKey, valKey, unit, maxOverride) {
    const W = 640, H = 240, padL = 56, padB = 34, padT = 12;
    const max = maxOverride || Math.max.apply(null, rows.map(r => r[valKey])) * 1.15;
    const bw = (W - padL - 16) / rows.length;
    const y = v => H - padB - (v / max) * (H - padB - padT);
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Bar chart">
      ${[0, .25, .5, .75, 1].map(f => `<line class="grid" x1="${padL}" x2="${W - 10}" y1="${y(max*f)}" y2="${y(max*f)}"></line>
        <text x="${padL - 8}" y="${y(max*f) + 4}" text-anchor="end">${Math.round(max*f)}</text>`).join('')}
      <line class="axis" x1="${padL}" x2="${W - 10}" y1="${H - padB}" y2="${H - padB}"></line>
      ${rows.map((r, i) => {
        const x = padL + i * bw + bw * .18, w = bw * .64;
        return `<rect class="b1" x="${x}" y="${y(r[valKey])}" width="${w}" height="${H - padB - y(r[valKey])}" rx="3"><title>${esc(r[labelKey])}: ${r[valKey]} ${unit}</title></rect>
          <text x="${x + w/2}" y="${H - padB + 16}" text-anchor="middle">${esc(r[labelKey])}</text>
          <text x="${x + w/2}" y="${y(r[valKey]) - 5}" text-anchor="middle">${r[valKey]}</text>`;
      }).join('')}
      <text x="${padL}" y="${H - 4}">${esc(unit)}</text>
    </svg>`;
  }
  function groupedChart(rows) {
    const W = 660, H = 260, padL = 56, padB = 36, padT = 14;
    const max = Math.max.apply(null, rows.map(r => r.avgUs)) * 1.5;
    const bw = (W - padL - 16) / rows.length;
    const y = v => H - padB - (v / max) * (H - padB - padT);
    return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Average and worst block cost by track count">
      ${[0, .25, .5, .75, 1].map(f => `<line class="grid" x1="${padL}" x2="${W - 10}" y1="${y(max*f)}" y2="${y(max*f)}"></line>
        <text x="${padL - 8}" y="${y(max*f)+4}" text-anchor="end">${Math.round(max*f)}</text>`).join('')}
      <line class="axis" x1="${padL}" x2="${W - 10}" y1="${H - padB}" y2="${H - padB}"></line>

        const x = padL + i * bw + bw * .12, w = bw * .3;

  /* ---------- findings ---------- */
  function filtered() {
    const q = state.q.trim().toLowerCase();
    let out = F.filter(f => {
      if (state.pr.size && !state.pr.has(f.priority)) return false;
      if (state.cat !== 'all' && f.category !== state.cat) return false;
      if (state.sub !== 'all' && f.subsystem !== state.sub) return false;
      if (q) {
        const hay = [f.id, f.title, f.summary, f.category, f.subsystem, f.files.join(' '), f.recommendation].join(' ').toLowerCase();
        if (hay.indexOf(q) < 0) return false;
      }
      return true;
    });
    const cmp = {
      priority: (a, b) => PR[a.priority] - PR[b.priority] || a.id.localeCompare(b.id),
      id: (a, b) => a.id.localeCompare(b.id),
      effort: (a, b) => EFF[a.effort] - EFF[b.effort] || PR[a.priority] - PR[b.priority],
      impact: (a, b) => b.impact[state.metric] - a.impact[state.metric] || PR[a.priority] - PR[b.priority]
    };
    return out.sort(cmp[state.sort] || cmp.priority);
  }

  function copyText(text, btn) {
    const done = () => { if (btn) { const old = btn.textContent; btn.textContent = 'Copied'; setTimeout(() => btn.textContent = old, 1200); } };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, () => fallback(text, done));
    } else fallback(text, done);
  }
  function fallback(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.left = '-9999px';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); } catch (e) {}
    document.body.removeChild(ta);
  }

  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });

      <h2>Reproduce</h2>
      <div class="card"><pre>swift build -c release
.build/release/dalnok-cli make-test-project /tmp/audit-band --preset band
.build/release/dalnok-cli bench --tracks 64 --seconds 20
.build/release/dalnok-cli audit-scale --tracks 128 --clips 32
.build/release/dalnok-cli audit-bench /tmp/audit-band/band.dalnok --edits 200
DALNOK_SNAPSHOT_DELAY=0 .build/release/Dalnok /tmp/audit-band/band.dalnok --snapshot /tmp/audit.png</pre>
      <p class="tiny muted">Full commands, raw output and caveats: <code>docs/audits/benchmarks/</code>.</p></div>

      <h2>Deliverables</h2>
      <div class="card"><ul class="tiny" style="font-size:13px">
        <li><code>docs/audits/codebase-audit-2026-11.md</code> — the report.</li>
        <li><code>docs/audits/findings.json</code> — machine-readable findings (the source of this page).</li>
        <li><code>docs/audits/modernization-roadmap.md</code> — ordered plan with acceptance criteria.</li>
        <li><code>docs/audits/benchmarks/</code> — method, results.json, raw output, code inventory.</li>
        <li><code>docs/audits/dashboard/index.html</code> — this page.</li>
      </ul></div>`;
  }

  /* ---------- panel dispatch ---------- */
  const rendered = {};
  function renderPanel(name) {
    if (name === 'overview') renderOverview();
    else if (name === 'codebase') renderCodebase();
    else if (name === 'performance') renderPerformance();
    else if (name === 'findings') renderFindings();
    else if (name === 'roadmap') renderRoadmap();
    else if (name === 'matrix') renderMatrix();
    else if (name === 'architecture') renderArchitecture();
    else if (name === 'method') renderMethod();
    rendered[name] = true;
  }

  /* ---------- search ---------- */
  $('#q').addEventListener('input', e => {
    state.q = e.target.value;
    if (state.tab !== 'findings') showTab('findings');
    else renderFindings();
  });
  $('#export').addEventListener('click', () => {
    const blob = new Blob([JSON.stringify(A, null, 2)], {type: 'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'dalnok-audit-findings.json';
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
  });

  /* ---------- keyboard ---------- */
  document.addEventListener('keydown', e => {
    if (e.key === '/' && document.activeElement !== $('#q') && !['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName)) {
      e.preventDefault(); $('#q').focus();
    }
    if (e.key === 'Escape' && dlg.open) dlg.close();
  });

  /* ---------- boot ---------- */
  const initial = (location.hash || '').slice(1);
  showTab(TABS.indexOf(initial) >= 0 ? initial : 'overview');
  setTimeout(function () { window.scrollTo(0, 0); }, 0);
})();
</script>
